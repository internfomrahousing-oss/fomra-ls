[build]
  publish = "build/web"
  command = "npm install"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[functions]
  node_bundler = "esbuild"

# ── API routes → Netlify Functions ────────────────────────────────────────────
[[redirects]]
  from = "/api/magicbricks"
  to = "/.netlify/functions/magicbricks"
  status = 200
  force = true

[[redirects]]
  from = "/api/poi"
  to = "/.netlify/functions/poi"
  status = 200
  force = true

[[redirects]]
  from = "/api/tnrera/*"
  to = "/.netlify/functions/tnrera/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/tnlands/*"
  to = "/.netlify/functions/tnlands/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/api/tnlands"
  to = "/.netlify/functions/tnlands"
  status = 200
  force = true

[[redirects]]
  from = "/api/99acres"
  to = "/.netlify/functions/99acres"
  status = 200
  force = true

[[redirects]]
  from = "/api/housing"
  to = "/.netlify/functions/housing"
  status = 200
  force = true

[[redirects]]
  from = "/api/competitors"
  to = "/.netlify/functions/competitors"
  status = 200
  force = true

# ── Flutter SPA fallback (must be last) ───────────────────────────────────────
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# ── Cache headers ─────────────────────────────────────────────────────────────
[[headers]]
  for = "/flutter_service_worker.js"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-store, no-cache, must-revalidate"
