# Flutter analyze + test.
#
# Auto runs on push/PR are paused: GitHub Actions hosted runners for this org
# currently fail immediately with:
#   "The job was not started because recent account payments have failed or
#    your spending limit needs to be increased."
# Fix that under:
#   https://github.com/organizations/internfomrahousing-oss/settings/billing
# then restore the `push` / `pull_request` triggers below.
name: Flutter CI

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - run: flutter pub get
      - name: flutter analyze
        id: analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings 2>&1 | tee analyze_output.txt
      - name: Post analyze failure as a commit comment
        if: failure() && steps.analyze.outcome == 'failure'
        run: |
          BODY=$(python3 -c "
import json
with open('analyze_output.txt') as f:
    text = f.read()[-60000:]
print(json.dumps({'body': '### flutter analyze failed\n\n```\n' + text + '\n```'}))
")
          curl -s -X POST \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}/commits/${{ github.sha }}/comments" \
            -d "$BODY"
      - run: flutter test
