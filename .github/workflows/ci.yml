name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  serverless-functions:
    name: Serverless function syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: Syntax-check every api/ and backend/ file
        run: |
          set -e
          for f in api/*.js $(find backend/src -name '*.js'); do
            node --check "$f"
          done
