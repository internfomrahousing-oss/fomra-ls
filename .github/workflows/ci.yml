name: CI
#
# Auto runs on push/PR are OFF: this fired automatically on every single
# push and PR update, actually running (and repeatedly failing) on billed
# GitHub-hosted runners — a real, avoidable contributor to Actions billing.
# Matches the manual-only pattern flutter.yml already used for the same
# reason. Run manually via the Actions tab, or restore the triggers below
# once billing is confirmed clear and this workflow is confirmed green.

on:
  workflow_dispatch:

jobs:
  flutter:
    name: Flutter analyze & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.2'
          channel: stable
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test

  serverless-functions:
    name: Serverless function syntax check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '18'
      - run: npm install
      - name: Syntax-check every api/ and backend/ file
        run: |
          set -e
          for f in api/*.js $(find backend/src -name '*.js'); do
            node --check "$f"
          done
