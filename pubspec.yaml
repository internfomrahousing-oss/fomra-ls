name: fomra_ls
description: FomraLS - Land & Property Management System for Fomra Housing
publish_to: 'none'
version: 1.0.1+24

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6
  flutter_svg: ^2.0.9
  intl: ^0.19.0
  fl_chart: ^0.66.2
  geolocator: ^13.0.0
  http: ^1.2.0
  file_picker: ^8.0.0
  image: ^4.5.4
  flutter_map: ^7.0.2
  flutter_map_cancellable_tile_provider: ^3.0.2
  latlong2: ^0.9.1
  shared_preferences: ^2.3.2
  url_launcher: ^6.3.0
  supabase_flutter: ^2.5.0
  pdf: ^3.11.1
  printing: ^5.13.3
  firebase_core: ^4.11.0
  firebase_messaging: ^16.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
